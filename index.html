<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="css/style.css">
  
  <title>Frontend Mentor | Interactive pricing component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <!-- <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style> -->
</head>
<body>
  <main>
    <section id="title">
      <h1>Simple, traffic-based pricing</h1>
      <p>Sign-up for our 30-day trial. No credit card required.</p> 
    </section>

    <section id="components">
      <div id="dynamic">
        <p id="pageviews"><span id="display2"></span> PAGEVIEWS</p>
        <p id="price"><span id="symbol">$</span><span id="display"></span> /month</p>
      </div>
      
      <div id="bar">
        <input type="range" id="range-bar" >
        <span class="thumb"></span>
      </div>

      <div id="toggle-cta">
        <p>Monthly Billing</p>
        <label class="switch">
          <input type="checkbox" id="checkbox">
          <span class="slider"></span>
        </label>
        <p>Yearly Billing <span>25% discount</span></p>
      </div>
      
      <div id="check">
        <ul>
          <li><img src="images/icon-check.svg" alt="icon-check">Unlimited websites</li>
          <li><img src="images/icon-check.svg" alt="icon-check">100% data ownership</li>
          <li><img src="images/icon-check.svg" alt="icon-check">Email reports</li>
        </ul>

        <a href="">Start my trial</a>
      </div>
      
    </section>

    
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Lindsayram</a>.
  </footer>
</body>
<script src="js/script.js"></script>
</html>
